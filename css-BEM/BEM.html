<!-- BEM
 Block: Thanh phan chinh, doc lap - card, button, form
 Element: Thanh phan con cua block, khong ton tai doc lap - card__title, form__input
 Modifier: Phien ban khac nhau (kieu dang, trang thai...) - button--large, card--highlighted

 *Quy tat: block__element--modifier
=> dung 2 underscore cho element: __
=> dung 2 dash cho modifier: --
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS BEM Practice</title>
  <style>

    /*bloack*/
    .product{
      border: 1px solid #ccc;
      padding: 16px;
      width: 250px;
      font-family: Arial, Helvetica, sans-serif;
      border-radius: 8px;
      background-color: #fff;
    }

    /*element*/
    .product__title{
      font-size: 20px;
      margin-bottom: 8px;
    }

    .product__description{
      font-size: 14px;
      margin-bottom: 12px;
    }

    .product__button{
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 8px;
    }

    /*modifier*/
    .product__button--primary{
      background-color: #007bff;
      color: white;
    }

    .product__button--secondary{
      background-color: #6c757d;
      color: white;
    }
    
  </style>
</head>

<body>
  <div class="product">
    <h2 class="product__title">Male T-Shirt</h2>
    <p class="product__description">100% cotton, breathable fabric</p>
    <button class="product__button--primary">BUY NOW</button>
    <button class="product__button--secondary">Add to cart</button>
  </div>
</body>
</html>
