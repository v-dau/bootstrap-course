<!--dropdown, popover, tooltips practice-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown - Popover - Tooltips</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body class="p-4"> <!--p-4 dung de them padding deu 4 don vi(1.5rem) cho body-->
  <h2>Bootstrap demo: Dropdown, Tooltip & Popover</h2>

  <!--Dropdown-->
  <div class="dropdown mb-4"> <!--mb-4: margin bottom 4 units-->
    <button class="btn btn-primary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
      Choose one option
    </button>
    <ul class="dropdown-menu">
      <li><a href="#" class="dropdown-item">Option 1</a></li>
      <li><a href="#" class="dropdown-item">2</a></li>
      <li><a href="#" class="dropdown-item">3</a></li>
    </ul>
  </div>  

  <!--Tooltip-->
  <button class="btn btn-info mb-4" type="button" data-bs-toggle="tooltip" title="This is tooltip!">
    Hover me
  </button>

  <!--Popover-->
  <button type="button" class="btn btn-warning" data-bs-toggle="popover" title="Popover title" data-bs-content="This is popover's content">
    Click to show popover
  </button>



  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.min.js" integrity="sha384-VQqxDN0EQCkWoxt/0vsQvZswzTHUVOImccYmSyhJTp7kGtPed0Qcx8rK9h9YEgx+" crossorigin="anonymous"></script>
  <!--script kich hoat tooltip va popover-->
  <script>
    const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]');
    tooltipTriggerList.forEach(el => new bootstrap.Tooltip(el));

    const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]');
    popoverTriggerList.forEach(el => new bootstrap.Popover(el));
  </script>
</body>
</html>
