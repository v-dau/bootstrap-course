<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Global Styles Comparison</title>
  <style>
    /* Chia màn hình làm 2 cột */
    .container {
      display: flex;
      gap: 20px;
    }

    .box {
      flex: 1;
      padding: 1rem;
      border: 1px solid #ccc;
    }

    .box h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
    }

    img {
      width: 100%;
    }
  </style>

  <!-- ✅ Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <h1 class="text-center mb-4">So sánh: Có Bootstrap vs Không Bootstrap</h1>

  <div class="container">
    <!-- 🔵 CÓ Bootstrap -->
    <div class="box bg-light">
      <h2>Có Bootstrap</h2>

      <p>
        Đây là một đoạn văn bản với line-height chuẩn của Bootstrap.
      </p>

      <ul class="list-unstyled">
        <li>Item 1</li>
        <li>Item 2</li>
      </ul>

      <button class="btn btn-primary">Nút Bootstrap</button>

      <img src="https://via.placeholder.com/300x100" alt="Ảnh demo">
    </div>

    <!-- 🔴 KHÔNG Bootstrap -->
    <div class="box" id="no-bootstrap">
      <h2>Không Bootstrap</h2>

      <p>
        Đây là cùng đoạn văn, nhưng không có line-height chuẩn.
      </p>

      <ul>
        <li>Item 1</li>
        <li>Item 2</li>
      </ul>

      <button>Nút thường</button>

      <img src="https://via.placeholder.com/300x100" alt="Ảnh demo">
    </div>
  </div>

  <!-- ✅ Xóa style Bootstrap khỏi cột bên phải -->
  <script>
    const noBootstrap = document.getElementById('no-bootstrap');
    const reset = document.createElement('style');
    reset.innerHTML = `
      #no-bootstrap *, #no-bootstrap *::before, #no-bootstrap *::after {
        all: unset;
        display: revert;
      }

      #no-bootstrap button {
        border: 1px solid gray;
        padding: 4px 8px;
      }
    `;
    document.head.appendChild(reset);
  </script>

</body>
</html>
